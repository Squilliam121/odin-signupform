<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOP Sign-up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="sidebar">
        <p id="credit">idfk where this came from</p>
    </div>

    <main>
        <h1>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.<br>Sign up <em>now</em> to get started.<br><br>You <em>know</em> you want to.
        </h1>

        <form>
            <div id="drop-shadow">
            <h2>Let's do this!</h2>
            
            <div class="row">
                <div class="item">
                    <label for="first-name">FIRST NAME</label>
                    <input type="text" id="first-name" name="first-name">
                </div>

                <div class="item">
                    <label for="last-name">LAST NAME</label>
                    <input type="text" id="last-name" name="last-name">
                </div>
            </div>

            <div class="row">
                <div class="item">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="item">
                    <label for="phone-number">PHONE NUMBER</label>
                    <input type="number" id="phone-number" name="phone-number">
                </div>
            </div>

            <div class="row">
                <div class="item">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" required minlength="8" name="password">
                </div>

                <div class="item">
                    <label for="confirm-password">CONFIRM PASSWORD</label>
                    <input type="password" id="confirm-password" required minlength="8"  name="confirm-password">
                </div>
            </div>
            </div>

            <button type="submit">Create Account</button>
        </form>
        <h3>Already have an account? <a href="piss off" target="_blank">Log in</a></h3>
    </main>
</body>
</html>
